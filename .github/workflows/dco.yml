name: Verify Commit Signatures

on:
  pull_request:
    branches: ["**"]

jobs:
  verify-commits:
    name: Verify Commit Signatures
    runs-on: ubuntu-latest

    steps:
      - name: Verify commit signatures
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo, number } = context.issue;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });

            const { data: commits } = await github.rest.pulls.listCommits({
              owner,
              repo,
              pull_number: number,
            });

            let unverifiedCommits = [];
            for (const commit of commits) {
              if (!commit.commit.verification.verified) {
                unverifiedCommits.push(`${commit.commit.message.split('\n')[0]} (${commit.sha.substring(0, 7)})`);
              }
            }

            if (unverifiedCommits.length > 0) {
              core.setFailed(`Found ${unverifiedCommits.length} unverified commit(s):\n${unverifiedCommits.join('\n')}`);
            }